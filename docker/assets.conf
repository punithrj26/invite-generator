# Local stand-in for the CDN (CloudFront + S3, docs/04 §3): serves template fonts/images from ./templates.
server {
    listen 80;
    root /srv/templates;
    server_tokens off;

    # Only asset files; template.json and anything else stay private.
    location ~* \.(ttf|otf|webp|png|jpe?g)$ {
        # Web export (RenderRepaintBoundary.toImage) needs CORS on every image/font the canvas draws.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    types {
        font/ttf    ttf;
        font/otf    otf;
        image/webp  webp;
        image/png   png;
        image/jpeg  jpg jpeg;
    }
}
